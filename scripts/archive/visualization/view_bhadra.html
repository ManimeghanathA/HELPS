<script>

var bhadraMap = map_8d7eadaca3a52b05913c10642a44211e;
var entireRegion = geo_json_a052e9384da388396c4ad9338d3ad5ad;


// ------------------------------------------------------------
// ENABLE FRACTIONAL ZOOM
// ------------------------------------------------------------

bhadraMap.options.zoomSnap = 0.5;
bhadraMap.options.zoomDelta = 0.5;


// ------------------------------------------------------------
// Track current hover state
// ------------------------------------------------------------

var bhadraHoverActive = false;
var previousZoom = null;


// ------------------------------------------------------------
// Attach events to every polygon in the entire-region layer
// ------------------------------------------------------------

entireRegion.eachLayer(function(layer) {

    layer.on({

        // ====================================================
        // MOUSE ENTER
        // ====================================================

        mouseover: function(e) {

            if (bhadraHoverActive) {
                return;
            }

            bhadraHoverActive = true;

            // Save current zoom
            previousZoom = bhadraMap.getZoom();


            // ------------------------------------------------
            // Highlight entire Bhadra boundary
            // ------------------------------------------------

            layer.setStyle({
                color: "#2563eb",
                weight: 6,
                fillColor: "#3b82f6",
                fillOpacity: 0.08
            });

            layer.bringToFront();


            // ------------------------------------------------
            // Zoom exactly +0.5
            // ------------------------------------------------

            bhadraMap.setZoom(
                previousZoom + 0.5,
                {
                    animate: true,
                    duration: 0.35
                }
            );
        },


        // ====================================================
        // MOUSE LEAVE
        // ====================================================

        mouseout: function(e) {

            bhadraHoverActive = false;


            // ------------------------------------------------
            // Restore boundary
            // ------------------------------------------------

            layer.setStyle({
                color: "#8b5cf6",
                weight: 3,
                fillColor: "#2563eb",
                fillOpacity: 0.01
            });


            // ------------------------------------------------
            // Restore original zoom
            // ------------------------------------------------

            if (previousZoom !== null) {

                bhadraMap.setZoom(
                    previousZoom,
                    {
                        animate: true,
                        duration: 0.35
                    }
                );

                previousZoom = null;
            }
        }

    });

});

</script>
